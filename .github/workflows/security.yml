name: Security

on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'   # weekly, so new CVEs in unchanged code still surface
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    uses: frivas/.github/.github/workflows/security.yml@v2
    with:
      codeql-languages: '["go", "actions"]'
      go-version-file: server/go.mod
